name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepara il gioco dentro l'APK
        run: |
          mkdir -p android/app/src/main/assets
          curl -sSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o android/app/src/main/assets/three.min.js
          sed 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' index.html > android/app/src/main/assets/index.html
      - name: Chiave di firma fissa (se presente nei segreti)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "MI_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; echo "Firma fissa attiva"; else echo "Nessuna chiave nei segreti: firma di prova"; fi
      - name: Compila
        working-directory: android
        env:
          MI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          if [ -n "$MI_KEYSTORE" ]; then gradle bundleRelease --no-daemon --stacktrace; cp app/build/outputs/bundle/release/app-release.aab ../MonstersIsland.aab; fi
      - name: Rinomina APK e prepara l'aggiornamento automatico
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MonstersIsland.apk
          cp android/app/src/main/assets/index.html index.html
          cp android/app/src/main/assets/three.min.js three.min.js
          SHELL_V=$(grep -o 'SHELL = [0-9]*' android/app/src/main/java/com/jobbyboy/monstersisland/MainActivity.java | grep -o '[0-9]*')
          WIN_V=$(grep -o "const SHELL = [0-9]*" windows/main.js | grep -o "[0-9]*")
          echo "{\"code\": ${GITHUB_RUN_NUMBER}, \"game\": ${GITHUB_RUN_NUMBER}, \"shell\": ${SHELL_V}, \"win\": ${WIN_V}}" > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: MonstersIsland-APK
          path: |
            MonstersIsland.apk
            MonstersIsland.aab
          if-no-files-found: ignore
      - name: Pubblica come ultima versione
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Monsters Island – ultima versione
          body: APK aggiornato automaticamente all'ultima modifica del gioco.
          files: |
            MonstersIsland.apk
            MonstersIsland.aab
            version.json
            index.html
            three.min.js
          make_latest: true

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepara il gioco
        shell: bash
        run: |
          mkdir -p windows/game
          curl -sSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o windows/game/three.min.js
          sed 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' index.html > windows/game/index.html
      - name: Compila l'installer .exe
        working-directory: windows
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --publish never
          ls dist
      - name: Pubblica l'installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          files: windows/dist/MonstersIsland-Setup.exe
